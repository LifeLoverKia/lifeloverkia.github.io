"], "dates": {}, "metadata_checked": null, "access_checked": "2026-10-31", "access_metadata_source": "", "publisher_open_access": null}, {"id": "scholar:orientamentoememoriaspazialeeffettidellavegliaprotratta", "title": "Orientamento e memoria spaziale: effetti della veglia protratta.", "authors": "Casagrande, M.; Martella, D.; Paonessa, A.; Saracini, C.; Puce, L.; Pirri, F.; et al.", "year": 2006, "type": "Conference abstract", "topics": ["Cognition and learning"], "venue": "XVI Congresso Nazionale dell’Associazione Italiana di Medicina del Sonno", "citation": "Casagrande, M.; Martella, D.; Paonessa, A.; Saracini, C.; Puce, L.; Pirri, F.; et al. (2006). Orientamento e memoria spaziale: effetti della veglia protratta. XVI Congresso Nazionale dell’Associazione Italiana di Medicina del Sonno.", "doi": "", "order": 52, "orcid_ids": [], "sources": ["https://scholar.google.com/citations?user=HtpMVGIAAAAJ"], "dates": {}, "metadata_checked": null, "access_checked": "2026-10-31", "access_metadata_source": "", "publisher_open_access": null}, {"id": "title\\:repetitivetmsstimulationonvirtual3dnavigationgenderdifferencesinfrontalandparietalinvolvement\\:2008", "title": "Repetitive Tms Stimulation on Virtual 3D Navigation: Gender Differences in Frontal and Parietal Involvement", "authors": "Chiara Saracini; D. Basso; M. O. Belardinelli", "year": 2008, "type": "Conference paper", "topics": ["Spatial cognition and HRI"], "venue": "20th IAPS Conference Proceedings, Rome, Italy", "citation": "Chiara Saracini; D. Basso; M. O. Belardinelli. (2008). Repetitive Tms Stimulation on Virtual 3D Navigation: Gender Differences in Frontal and Parietal Involvement. 20th IAPS Conference Proceedings, Rome, Italy.", "doi": "", "order": 53, "orcid_ids": [], "sources": ["https://www.semanticscholar.org/paper/7859c14b40e53778762ca5c34924b5fee5d5e00a"], "dates": {}, "metadata_checked": null, "access_checked": "2026-10-31", "access_metadata_source": "", "publisher_open_access": null, "researchgate_url": "https://www.researchgate.net/publication/38134247_Repetitive_TMS_stimulation_on_virtual_3D_navigation_Gender_differences_in_frontal_and_parietal_involvement"}, {"id": "title\\:theadvantageofmobilitymobileteleoperationformobilerobots\\:2009", "title": "The Advantage of Mobility: Mobile Tele-operation for Mobile Robots", "authors": "Alberto Valero; Gabriele Randelli; Chiara Saracini; Fabiano Botta; Massimo Mecella", "year": 2009, "type": "Conference paper", "topics": ["Spatial cognition and HRI"], "venue": "Adaptive and Emergent Behaviour and Complex Systems - Proceedings of the 23rd Convention of the Society for the Study of Artificial Intelligence and Simulation of Behaviour, AISB 2009", "citation": "Alberto Valero; Gabriele Randelli; Chiara Saracini; Fabiano Botta; Massimo Mecella. (2009). The Advantage of Mobility: Mobile Tele-operation for Mobile Robots. Adaptive and Emergent Behaviour and Complex Systems - Proceedings of the 23rd Convention of the Society for the Study of Artificial Intelligence and Simulation of Behaviour, AISB 2009.", "doi": "", "order": 54, "orcid_ids": ["39920182"], "sources": ["https://www.semanticscholar.org/paper/f7691c8725bcc06821968f66d6cf82b9c90356ee", "https://orcid.org/0000-0002-1594-7382/work/39920182"], "dates": {}, "metadata_checked": null, "access_checked": "2026-10-31", "access_metadata_source": "", "publisher_open_access": null}], "content": {"en": {"headings": ["Research", "Publications", "Projects & collaborations", "Invited talks & public engagement", "Teaching & academic service", "Background", "Let’s connect"], "question": "How do we turn the world into an experience?", "intro": "I study perception, cognition and consciousness, and the ethical questions that emerge when technologies become part of how we think and relate to others.", "bio": "I am an Italian cognitive neuroscientist based in Talca, Chile, and an Associate Professor on the research track at Universidad Católica del Maule. At CINPSI Neurocog, my work combines experimental psychology, EEG and interdisciplinary inquiry. My research began with spatial cognition and virtual environments and developed towards perceptual awareness, bistability and the relationship between perception and higher-order cognitive processes.", "research": [{"title": "Perception & consciousness", "description": "Binocular rivalry and other bistable phenomena offer a way to examine how a changing perceptual experience emerges from constant sensory input. I am interested in the relationship between these dynamics, individual differences and cognitive flexibility."}, {"title": "Brain dynamics & cognition", "description": "EEG, behavioural experiments and brain stimulation inform my work on perceptual awareness, attention, cognitive control, learning and the links between perception and action."}, {"title": "Neuroethics & human–AI relations", "description": "My conceptual work examines neurorights, cognitive sovereignty and the psychological and ethical dimensions of relationships with generative AI, including techno-emotional projection."}], "service": ["I teach and coordinate postgraduate courses in the Doctorate in Psychology and Master’s in Neuroscience, and contribute teaching to Kinesiology and Philosophy. My teaching covers research ethics, scientific communication, cognitive processes, cognitive neuroscience and the scientific study of consciousness.", "I serve on postgraduate academic committees and faculty groups, and am the designated Alternate Director of the Master’s in Neuroscience and, separately, of CINPSI Neurocog. I have been a member of UCM’s Scientific Ethics Committee since 2019, serving as Acting Secretary in 2024 and Acting Vice-President in 2026.", "I have served as Assistant Editor for BMC Psychology since 2020 and contribute peer review across psychology, neuroscience, education and interdisciplinary journals."], "background": ["PhD in Cognitive Psychology, Psychophysiology and Personality, Sapienza University of Rome, 2011. Thesis: Spatial Cognition in Virtual Environments.", "Master’s in Psychology of Information Processing, with honours, Sapienza University of Rome, 2007.", "Bachelor’s in Cognitive Processes Methodology, with honours, Sapienza University of Rome, 2003.", "Further training in bioethics at Universidad Católica del Maule and in ethical and regulatory aspects of clinical research at the US National Institutes of Health, 2021."], "cv_url": "https://drive.google.com/uc?export=download&id=10ig7s5eWo7N2Hchg7pVwjo2sPQC98Ffc", "mentoring": "I supervise postgraduate research in EEG and cognitive neuroscience. Completed work includes a 2024 Neuroscience master’s thesis on resting-state EEG markers of impulsivity and co-supervision of a 2024 doctoral thesis in Education. Current research supervision includes EEG and conscious access to emotionally valenced words.", "grant_reviews": "External evaluation of competitive research funding: ANID doctoral and master’s scholarships (Chile, since 2020); NWO Talent Programme, Veni competition (Netherlands, 2023); NCN OPUS 30 (LAP) research funding scheme (Poland, 2026)."}, "es": {"headings": ["Investigación", "Publicaciones", "Proyectos y colaboraciones", "Charlas invitadas y vinculación", "Docencia y servicio académico", "Formación", "Contacto"], "question": "¿Cómo se convierte el mundo en una experiencia?", "intro": "Investigo la percepción, la cognición y la conciencia, y las preguntas éticas que surgen cuando las tecnologías pasan a formar parte de cómo pensamos y nos relacionamos.", "bio": "Soy neurocientífica cognitiva italiana, radicada en Talca, Chile, y Profesora Asociada en la línea de investigación de la Universidad Católica del Maule. En CINPSI Neurocog combino psicología experimental, EEG y trabajo interdisciplinario. Mi trayectoria comenzó con la cognición espacial y los entornos virtuales, y se amplió hacia la conciencia perceptiva, la biestabilidad y su relación con los procesos cognitivos de orden superior.", "research": [{"title": "Percepción y conciencia", "description": "Utilizo la rivalidad binocular y otros fenómenos biestables para investigar cómo cambia la experiencia perceptiva cuando la información sensorial permanece constante, y cómo se relacionan estas dinámicas con las diferencias individuales y la flexibilidad cognitiva."}, {"title": "Dinámica cerebral y cognición", "description": "Estudio la conciencia perceptiva, la atención, el control cognitivo, el aprendizaje y las relaciones entre percepción y acción mediante EEG, experimentos conductuales y estimulación cerebral."}, {"title": "Neuroética y relaciones humano–IA", "description": "Mi trabajo conceptual aborda los neuroderechos, la soberanía cognitiva y las dimensiones psicológicas y éticas de las relaciones con la IA generativa, incluida la proyección tecnoemocional."}], "service": ["Imparto y coordino cursos de posgrado en el Doctorado en Psicología y el Magíster en Neurociencia, y contribuyo a la docencia en Kinesiología y Filosofía. Mis cursos abordan ética de la investigación, comunicación científica, procesos cognitivos, neurociencias cognitivas y el estudio científico de la conciencia.", "Integro comités académicos y claustros de posgrado y soy directora subrogante del Magíster en Neurociencia y, por separado, de CINPSI Neurocog. Soy miembro del Comité de Ética Científico de la UCM desde 2019; fui secretaria subrogante en 2024 y vicepresidenta subrogante en 2026.", "Desde 2020 soy editora asistente de BMC Psychology y realizo revisión por pares en psicología, neurociencias, educación y revistas interdisciplinarias."], "background": ["Doctorado en Psicología Cognitiva, Psicofisiología y Personalidad, Sapienza Universidad de Roma, 2011. Tesis sobre cognición espacial en entornos virtuales.", "Magíster en Psicología del Procesamiento de la Información, con honores, Sapienza Universidad de Roma, 2007.", "Grado en Metodología de los Procesos Cognitivos, con honores, Sapienza Universidad de Roma, 2003.", "Formación complementaria en discernimiento en bioética, UCM, y aspectos éticos y regulatorios de la investigación clínica, NIH, 2021."], "cv_url": "https://drive.google.com/uc?export=download&id=10ig7s5eWo7N2Hchg7pVwjo2sPQC98Ffc", "mentoring": "Superviso investigación de posgrado en EEG y neurociencia cognitiva. Entre los trabajos concluidos figuran una tesis de Magíster en Neurociencia de 2024 sobre marcadores EEG de impulsividad en reposo y la codirección de una tesis doctoral en Educación de 2024. La supervisión actual incluye EEG y acceso consciente a palabras con valencia emocional.", "grant_reviews": "Evaluación externa de financiamiento competitivo: becas de doctorado y magíster de ANID (Chile, desde 2020); NWO Talent Programme, concurso Veni (Países Bajos, 2023); concurso de investigación NCN OPUS 30 (LAP) (Polonia, 2026)."}, "it": {"headings": ["Ricerca", "Pubblicazioni", "Progetti e collaborazioni", "Conferenze su invito e divulgazione", "Didattica e servizio accademico", "Formazione", "Contatti"], "question": "Come diventa esperienza il mondo che ci circonda?", "intro": "Studio la percezione, la cognizione e la coscienza, e le domande etiche che emergono quando le tecnologie entrano nel nostro modo di pensare e di relazionarci.", "bio": "Sono una neuroscienziata cognitiva italiana che vive e lavora a Talca, in Cile, e Professoressa Associata nel percorso di ricerca dell’Universidad Católica del Maule. Al CINPSI Neurocog, il mio lavoro combina psicologia sperimentale, EEG e ricerca interdisciplinare. Ho iniziato occupandomi di cognizione spaziale e ambienti virtuali, per poi concentrarmi sulla consapevolezza percettiva, sulla bistabilità e sulle relazioni fra percezione e processi cognitivi di ordine superiore.", "research": [{"title": "Percezione e coscienza", "description": "La rivalità binoculare e gli altri fenomeni bistabili permettono di studiare come cambia l’esperienza percettiva quando lo stimolo rimane costante. Mi interessano i rapporti fra queste dinamiche, le differenze individuali e la flessibilità cognitiva."}, {"title": "Dinamiche cerebrali e cognizione", "description": "EEG, esperimenti comportamentali e stimolazione cerebrale contribuiscono al mio lavoro sulla consapevolezza percettiva, sull’attenzione, sul controllo cognitivo, sull’apprendimento e sui legami fra percezione e azione."}, {"title": "Neuroetica e relazioni umano–IA", "description": "Il mio lavoro concettuale riguarda i neurodiritti, la sovranità cognitiva e le dimensioni psicologiche ed etiche delle relazioni con l’IA generativa, inclusa la proiezione tecnoemozionale."}], "service": ["Insegno e coordino corsi nel Dottorato in Psicologia e nel Master in Neuroscienze, e contribuisco alla didattica di Kinesiologia e Filosofia. I miei corsi riguardano etica della ricerca, comunicazione scientifica, processi cognitivi, neuroscienze cognitive e studio scientifico della coscienza.", "Faccio parte di comitati accademici e collegi docenti post-laurea e sono direttrice supplente del Master in Neuroscienze e, separatamente, di CINPSI Neurocog. Sono membro del Comitato di Etica Scientifica della UCM dal 2019, con incarichi di segretaria supplente nel 2024 e vicepresidente supplente nel 2026.", "Dal 2020 sono Assistant Editor di BMC Psychology e svolgo attività di revisione tra pari in psicologia, neuroscienze, educazione e riviste interdisciplinari."], "background": ["Dottorato in Psicologia Cognitiva, Psicofisiologia e della Personalità, Sapienza Università di Roma, 2011. Tesi: Spatial Cognition in Virtual Environments.", "Laurea magistrale in Psicologia del Trattamento dell’Informazione, con lode, Sapienza Università di Roma, 2007.", "Laurea in Metodologia dei Processi Cognitivi, con lode, Sapienza Università di Roma, 2003.", "Formazione complementare in discernimento bioetico alla UCM e in aspetti etici e regolatori della ricerca clinica presso i National Institutes of Health statunitensi, 2021."], "cv_url": "https://drive.google.com/uc?export=download&id=10ig7s5eWo7N2Hchg7pVwjo2sPQC98Ffc", "mentoring": "Supervisiono ricerche post-laurea in EEG e neuroscienze cognitive. I lavori conclusi comprendono una tesi di Master in Neuroscienze del 2024 sui marcatori EEG a riposo dell’impulsività e la cosupervisione di una tesi di Dottorato in Educazione del 2024. La supervisione attuale comprende EEG e accesso cosciente a parole con valenza emotiva.", "grant_reviews": "Valutazione esterna di finanziamenti competitivi: borse di Dottorato e Master ANID (Cile, dal 2020); NWO Talent Programme, concorso Veni (Paesi Bassi, 2023); programma di finanziamento alla ricerca NCN OPUS 30 (LAP) (Polonia, 2026)."}}, "projects": [{"id": "network:COST_CA24148_EEG101", "title": "EEG101: Fundamentals of Open & Rigorous EEG Science", "titles": {"en": "EEG101: Fundamentals of Open & Rigorous EEG Science", "es": "EEG101: Fundamentals of Open & Rigorous EEG Science", "it": "EEG101: Fundamentals of Open & Rigorous EEG Science"}, "description": {"en": "International COST Action advancing open and rigorous EEG science through reporting standards, data curation and harmonisation, and community-wide methodological recommendations. I participate in Working Groups WG1, WG2 and WG3, which I joined in 2026.", "es": "COST Action internacional que promueve una ciencia EEG abierta y rigurosa mediante estándares de reporte, curación y armonización de datos y recomendaciones metodológicas para la comunidad. Participo en los grupos de trabajo WG1, WG2 y WG3, a los que me incorporé en 2026.", "it": "COST Action internazionale per una ricerca EEG aperta e rigorosa, attraverso standard di rendicontazione, cura e armonizzazione dei dati e raccomandazioni metodologiche condivise. Partecipo ai gruppi di lavoro WG1, WG2 e WG3, ai quali ho aderito nel 2026."}, "start": "2025-09-24", "end": "2029-09-23", "date_scope": "action", "type": "COST Action", "role": "Working Group member (WG1, WG2, WG3)", "grant": "CA24148", "funder": "COST", "status": "Ongoing", "url": "https://www.cost.eu/actions/CA24148/"}, {"id": "initiative:EEGManyAnalysts", "title": "EEGManyAnalysts", "titles": {"en": "EEGManyAnalysts", "es": "EEGManyAnalysts", "it": "EEGManyAnalysts"}, "description": {"en": "International many-analyst project investigating how EEG analysis choices and analyst characteristics affect research outcomes and replicability. I contributed as an independent EEG analyst to the analysis of a shared dataset. Coordinated by Katharina Paul and Jan Wacker, Universität Hamburg.", "es": "Proyecto internacional que investiga cómo las decisiones analíticas en EEG y las características de los analistas afectan los resultados y su replicabilidad. Contribuí como analista EEG independiente al análisis de un conjunto de datos compartido. Coordinado por Katharina Paul y Jan Wacker, Universität Hamburg.", "it": "Progetto internazionale che studia come le scelte di analisi EEG e le caratteristiche degli analisti influenzino i risultati e la replicabilità. Ho contribuito come analista EEG indipendente all’analisi di un dataset condiviso. Coordinato da Katharina Paul e Jan Wacker, Universität Hamburg."}, "start": "2025", "end": "", "type": "Open-science collaboration", "role": "Contributing EEG analyst", "grant": "", "funder": "DFG", "status": "Ongoing", "url": "https://www.coscience-personality.com/manyanalysts", "date_scope": "contribution"}, {"id": "grant:FOVI 230078", "title": "Strengthening a network for advanced neuroscience research focusing on rural populations vulnerable to socio-environmental impacts", "description": {"en": "International research collaboration and advanced training in neuroscience addressing the socio-environmental impacts of climate change on vulnerable rural populations.", "es": "Colaboración internacional y formación avanzada en neurociencias sobre los impactos socioambientales del cambio climático en poblaciones rurales vulnerables.", "it": "Collaborazione internazionale e formazione avanzata nelle neuroscienze sui possibili impatti socioambientali del cambiamento climatico nelle popolazioni rurali vulnerabili."}, "start": "2023-03-02", "end": "2025-04-02", "role": "Co-Researcher (Principal Investigator: Boris Lucero)", "grant": "FOVI 230078", "funder": "ANID", "status": "Completed", "url": "https://investigadores.anid.cl//es/works/790603", "titles": {"en": "Strengthening a network for advanced neuroscience research focusing on rural populations vulnerable to socio-environmental impacts", "es": "Fortalecimiento de una red de investigación avanzada en neurociencia centrada en poblaciones rurales vulnerables a impactos socioambientales", "it": "Rafforzamento di una rete di ricerca avanzata nelle neuroscienze sulle popolazioni rurali vulnerabili agli impatti socioambientali"}}, {"id": "grant:FONDECYT Iniciación 11190828", "title": "Conscious percept emergence and cognitive flexibility in visual bistable phenomena: An EEG experimental study", "description": {"en": "An experimental EEG project investigating the emergence of conscious percepts and cognitive flexibility through visual bistability.", "es": "Proyecto experimental con EEG sobre la emergencia de perceptos conscientes y la flexibilidad cognitiva mediante fenómenos de percepción visual biestable.", "it": "Progetto sperimentale EEG sull’emergere dei percetti coscienti e sulla flessibilità cognitiva attraverso i fenomeni di percezione visiva bistabile."}, "start": "2019-11-02", "end": "2023-10-31", "role": "Principal Investigator", "grant": "FONDECYT Iniciación 11190828", "funder": "ANID", "status": "Completed", "url": "https://investigadores.anid.cl//es/works/583519", "titles": {"en": "Conscious percept emergence and cognitive flexibility in visual bistable phenomena: An EEG experimental study", "es": "Emergencia del percepto consciente y flexibilidad cognitiva en fenómenos visuales biestables: un estudio experimental con EEG", "it": "Emergenza del percetto cosciente e flessibilità cognitiva nei fenomeni visivi bistabili: uno studio sperimentale EEG"}}, {"id": "grant:REDES190078", "title": "Collaboration network for the study of chronic diseases in agricultural workers", "description": {"en": "A Chilean collaboration network studying pesticide exposure and public health in agricultural workers.", "es": "Red de colaboración chilena para estudiar la exposición a plaguicidas y la salud pública en trabajadores agrícolas.", "it": "Rete di collaborazione cilena per lo studio dell’esposizione ai pesticidi e della salute pubblica nei lavoratori agricoli."}, "start": "2019-01-02", "end": "2021-12-31", "role": "Associate Researcher (Principal Investigator: Sandra Cortés)", "grant": "REDES190078", "funder": "ANID", "status": "Completed", "url": "https://investigadores.anid.cl//es/works/628295", "titles": {"en": "Collaboration network for the study of chronic diseases in agricultural workers", "es": "Red de colaboración para el estudio de enfermedades crónicas en trabajadores agrícolas", "it": "Rete di collaborazione per lo studio delle malattie croniche nei lavoratori agricoli"}}, {"id": "grant:GR09.133.1", "title": "Perceptual awareness and emotional contagion", "description": {"en": "Research on body-part perception and visual awareness through binocular rivalry.", "es": "Investigación sobre percepción de partes del cuerpo y conciencia visual mediante rivalidad binocular.", "it": "Ricerca sulla percezione delle parti del corpo e sulla consapevolezza visiva attraverso la rivalità binoculare."}, "start": "2012-06-30", "end": "2013-05-31", "role": "Research Fellow", "grant": "GR09.133.1", "funder": "IRCCS Fondazione Santa Lucia, in collaboration with Sapienza University of Rome", "status": "Completed", "url": "", "titles": {"en": "Perceptual awareness and emotional contagion", "es": "Conciencia perceptiva y contagio emocional", "it": "Consapevolezza percettiva e contagio emotivo"}}]}</script><script src="assets/labels.js?v=20261101-featured"></script><script src="assets/app.js?v=20261101-featured"></script></body></html>
